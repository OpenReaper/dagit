allowBuilds:
  # Vite requires its platform-specific esbuild binary. The WebSocket native
  # add-ons are optional and remain disabled.
  esbuild: true
  bufferutil: false
  utf-8-validate: false
  sharp: set this to true or false
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261001.1'
